[project]
name = "voxera-engine"
version = "0.1.1"
description = "Local voice design and character audio studio"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "fastapi>=0.110,<1", "uvicorn[standard]>=0.28,<1", "pydantic>=2.6,<3",
    "httpx>=0.27,<1", "sqlalchemy>=2.0.28,<3", "psutil>=5.9.8,<8",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
inference = [
    "torch>=2.5,<3", "torchaudio>=2.5,<3", "numpy>=1.26,<3", "soundfile>=0.12,<1",
    "qwen-tts==0.1.1", "voxcpm==2.0.3", "modelscope>=1.30,<2", "huggingface-hub>=0.34,<1",
]
desktop = ["pywebview>=6,<7; sys_platform == 'win32'"]
dev = ["httpx>=0.27,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]
